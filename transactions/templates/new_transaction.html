{% extends "base.html" %} {% load static %} {% load crispy_forms_tags %} 
{%block content %}
<div class="container row p-0 mt-0">
  <div class="col d-flex justify-content-between px-0">
    <h3 class="transactions-title">New Transaction</h3>
  </div>
<div class="transaction container glass mt-0">
  <div class="row">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="form_type" value="transaction" />
      {{ TransactionForm | crispy }}
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button type="button" class="transaction-button w-25" data-bs-toggle="modal" data-bs-target="#addAccountModal">
          + Add Account
        </button>
      </div>
      <button class="transaction-button w-100 h-auto" type="submit">Submit</button>
    </form>
  </div>
</div>

<!-- Add Account Modal -->
<div class="modal fade" id="addAccountModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="{% url 'account_create' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Add Account</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          {{ AccountForm|crispy }}
        </div>
        <div class="modal-footer">
          <button type="button" class="transaction-button w-100" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="transaction-button w-100">Save Account</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
