{% extends "base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Sign Out" %}{% endblock head_title %}

{% block content %}
<div class="glass form_container p-5">
<h1 class="text-center signin-title">{% trans "Sign Out" %}</h1>

<p class="text-center">{% trans 'Are you sure you want to sign out?' %}</p>
<div class="row">
  <div class="text-center">
    <form class="signup" method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    {% if redirect_field_value %}
    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
    {% endif %}
    <button class="signin-button" type="submit">{% trans 'Sign Out' %}</button>
  </form>
</div>
</div>
{% endblock content %}
